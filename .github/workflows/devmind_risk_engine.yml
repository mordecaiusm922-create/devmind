name: DevMind Risk Engine

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  governance-tests:
    name: DevMind Risk Engine
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest

      - name: Run governance invariant tests
        run: python -m pytest tests/test_policy_engine.py -v --tb=short

      - name: Run real-world risk simulation
        run: python simulate_real_risks.py
